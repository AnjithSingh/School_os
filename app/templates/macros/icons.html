{# Inline, dependency-free icon set. Stroke icons at 24x24, scaled by size. #}
{% macro icon(name, size=18, cls="") -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  {%- if name == "grid" -%}
    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {%- elif name == "users" -%}
    <path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  {%- elif name == "user" -%}
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  {%- elif name == "id-card" -%}
    <rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/>
    <path d="M6 16c.6-1.6 1.9-2.4 3.5-2.4S12.4 14.4 13 16"/><path d="M16 10h3M16 14h3"/>
  {%- elif name == "heart" -%}
    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/>
  {%- elif name == "book" -%}
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
  {%- elif name == "calendar" -%}
    <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
  {%- elif name == "check-square" -%}
    <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
  {%- elif name == "clipboard" -%}
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
    <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 11h8M8 15h6"/>
  {%- elif name == "award" -%}
    <circle cx="12" cy="8" r="6"/><path d="M15.5 13l1.5 9-5-3-5 3 1.5-9"/>
  {%- elif name == "file-text" -%}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <path d="M14 2v6h6M8 13h8M8 17h6"/>
  {%- elif name == "credit-card" -%}
    <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>
  {%- elif name == "megaphone" -%}
    <path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1z"/>
    <path d="M14 6.5a5 5 0 0 1 0 11M17 4a8.5 8.5 0 0 1 0 16"/>
  {%- elif name == "chart" -%}
    <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>
  {%- elif name == "shield" -%}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
  {%- elif name == "settings" -%}
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
  {%- elif name == "key" -%}
    <circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M17 6l3 3M14 9l2 2"/>
  {%- elif name == "home" -%}
    <path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>
  {%- elif name == "folder" -%}
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  {%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == "bell" -%}
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
  {%- elif name == "menu" -%}
    <path d="M3 6h18M3 12h18M3 18h18"/>
  {%- elif name == "x" -%}
    <path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == "plus" -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == "download" -%}
    <path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>
  {%- elif name == "upload" -%}
    <path d="M12 21V9M7 14l5-5 5 5"/><path d="M4 3h16"/>
  {%- elif name == "search" -%}
    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
  {%- elif name == "logout" -%}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>
  {%- elif name == "chevron-right" -%}
    <path d="M9 6l6 6-6 6"/>
  {%- elif name == "chevron-down" -%}
    <path d="M6 9l6 6 6-6"/>
  {%- elif name == "arrow-left" -%}
    <path d="M19 12H5M11 18l-6-6 6-6"/>
  {%- elif name == "edit" -%}
    <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
  {%- elif name == "trash" -%}
    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/>
  {%- elif name == "check" -%}
    <path d="M20 6L9 17l-5-5"/>
  {%- elif name == "alert" -%}
    <path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    <path d="M12 9v4M12 17h.01"/>
  {%- elif name == "info" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
  {%- elif name == "mail" -%}
    <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6L22 7"/>
  {%- elif name == "phone" -%}
    <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/>
  {%- elif name == "map-pin" -%}
    <path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
  {%- elif name == "lock" -%}
    <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
  {%- elif name == "printer" -%}
    <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>
  {%- elif name == "filter" -%}
    <path d="M3 4h18l-7 8v6l-4 3v-9z"/>
  {%- elif name == "arrow-right" -%}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == "spark" -%}
    <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/>
  {%- else -%}
    <circle cx="12" cy="12" r="9"/>
  {%- endif -%}
</svg>
{%- endmacro %}
